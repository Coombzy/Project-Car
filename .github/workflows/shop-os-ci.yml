# Shop OS quality gate — git-only.
# Plan / runbook: Docs/shop-os-ci.md
# Does not SSH to Doc, does not deploy Worker projectcar-brochure,
# does not use production / tunnel / Cloudflare secrets.
# Heavy steps are gated inside each job. There is no workflow-level paths filter,
# so a docs-only pull request still reports the required check names.
# A push to main runs every step.
name: Shop OS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shop-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shop-api:
    name: shop-api pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/project-car/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Shop OS changes
        id: shop_changes
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SHOP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          cd "$(git rev-parse --show-toplevel)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "shop=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${SHOP_BASE_SHA}"
          case "${base}" in
            *[!0-9a-fA-F]*|"")
              echo "pull request base sha is not hex" >&2
              exit 1
              ;;
          esac
          if [ "${#base}" -ne 40 ]; then
            echo "pull request base sha is not 40 hex characters" >&2
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${base}"
          fi
          changed="$(git diff --name-only --no-renames "${base}" HEAD)"
          shop=false
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            case "${path}" in
              apps/project-car/*|.github/workflows/shop-os-ci.yml)
                shop=true
                break
                ;;
            esac
          done <<< "${changed}"
          echo "shop=${shop}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python 3.12
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/project-car/api/pyproject.toml

      - name: Install shop-api (dev extras)
        if: steps.shop_changes.outputs.shop == 'true'
        run: python -m pip install -e ".[dev]"

      - name: pytest
        if: steps.shop_changes.outputs.shop == 'true'
        run: pytest

  shop-web:
    name: shop-web lint / typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/project-car/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Shop OS changes
        id: shop_changes
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SHOP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          cd "$(git rev-parse --show-toplevel)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "shop=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${SHOP_BASE_SHA}"
          case "${base}" in
            *[!0-9a-fA-F]*|"")
              echo "pull request base sha is not hex" >&2
              exit 1
              ;;
          esac
          if [ "${#base}" -ne 40 ]; then
            echo "pull request base sha is not 40 hex characters" >&2
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${base}"
          fi
          changed="$(git diff --name-only --no-renames "${base}" HEAD)"
          shop=false
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            case "${path}" in
              apps/project-car/*|.github/workflows/shop-os-ci.yml)
                shop=true
                break
                ;;
            esac
          done <<< "${changed}"
          echo "shop=${shop}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node 22
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/project-car/web/package-lock.json

      - name: Install shop-web
        if: steps.shop_changes.outputs.shop == 'true'
        run: npm ci

      - name: Lint / typecheck
        if: steps.shop_changes.outputs.shop == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.shop_changes.outputs.shop == 'true'
        run: npm test

      - name: next build smoke
        if: steps.shop_changes.outputs.shop == 'true'
        run: npm run build
        env:
          SHOP_API_URL: http://127.0.0.1:8000

  shop-web-visual:
    name: shop-web layout-shift / screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/project-car/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Shop OS changes
        id: shop_changes
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SHOP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          cd "$(git rev-parse --show-toplevel)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "shop=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${SHOP_BASE_SHA}"
          case "${base}" in
            *[!0-9a-fA-F]*|"")
              echo "pull request base sha is not hex" >&2
              exit 1
              ;;
          esac
          if [ "${#base}" -ne 40 ]; then
            echo "pull request base sha is not 40 hex characters" >&2
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${base}"
          fi
          changed="$(git diff --name-only --no-renames "${base}" HEAD)"
          shop=false
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            case "${path}" in
              apps/project-car/*|.github/workflows/shop-os-ci.yml)
                shop=true
                break
                ;;
            esac
          done <<< "${changed}"
          echo "shop=${shop}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python 3.12
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/project-car/api/pyproject.toml

      - name: Set up Node 22
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/project-car/web/package-lock.json

      - name: Install shop-api (dev extras)
        if: steps.shop_changes.outputs.shop == 'true'
        working-directory: apps/project-car/api
        run: python -m pip install -e ".[dev]"

      - name: Install shop-web
        if: steps.shop_changes.outputs.shop == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.shop_changes.outputs.shop == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build shop-web at the frozen clock
        if: steps.shop_changes.outputs.shop == 'true'
        run: bash visual/build-web.sh

      - name: Layout shift and screenshots
        if: steps.shop_changes.outputs.shop == 'true'
        run: npm run visual
