# Shop OS quality gate — git-only.
# Plan / runbook: Docs/shop-os-ci.md
# Does not SSH to Doc, does not deploy Worker projectcar-brochure,
# does not use production / tunnel / Cloudflare secrets.
# Heavy steps are gated inside each job. There is no workflow-level paths filter
# and no job-level if, so a docs-only pull request still reports the required
# check names as success. Each job's detect step chooses its own paths.
# shop-api runs for markdown that is not a repo-root file and not under docs/ or Docs/,
# and for the shop-web sources pytest reads. Text and images stay skipped.
# An API-only diff skips the web build. Screenshots still run, because the visual job
# logs into this pull request's API.
# Screenshot baselines are the pngs from main's latest green run, when that cache exists.
# Storing them on main is skipped when this commit's cache key already exists.
# A push to main runs every step. Superseded pull-request runs cancel; main does not.
name: Shop OS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shop-api:
    name: shop-api pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/project-car/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Shop OS changes
        id: shop_changes
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SHOP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          cd "$(git rev-parse --show-toplevel)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "shop=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${SHOP_BASE_SHA}"
          case "${base}" in
            *[!0-9a-fA-F]*|"")
              echo "pull request base sha is not hex" >&2
              exit 1
              ;;
          esac
          if [ "${#base}" -ne 40 ]; then
            echo "pull request base sha is not 40 hex characters" >&2
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${base}"
          fi
          changed="$(git diff --name-only --no-renames "${base}" HEAD)"
          shop=false
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            case "${path}" in
              # In bash case, * matches slashes, so *.md is every markdown
              # path. Skip pytest only for repo-root *.md and for docs/**
              # and Docs/**. Markdown anywhere else runs pytest, including
              # a README under the app (shop-api/**/README.md). *.txt and
              # images stay skipped. shop-web .tsx, .html, .ts, and
              # package.json still run pytest below.
              docs/*|Docs/*) continue ;;
              *.txt|*.png|*.jpg|*.jpeg|*.svg|*.webp|*.SVG) continue ;;
              *.md)
                case "${path}" in
                  */*) shop=true; break ;;
                  *) continue ;;
                esac
                ;;
              .github/workflows/shop-os-ci.yml|apps/project-car/api/*) shop=true; break ;;
              apps/project-car/web/*.tsx|apps/project-car/web/*.html|apps/project-car/web/*.ts|apps/project-car/web/package.json) shop=true; break ;;
              apps/project-car/web/*) continue ;;
              apps/project-car/*) shop=true; break ;;
            esac
          done <<< "${changed}"
          echo "shop=${shop}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python 3.12
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/project-car/api/pyproject.toml

      - name: Cache shop-api environment
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/cache@v4
        with:
          path: apps/project-car/api/.venv
          key: shop-api-venv-${{ runner.os }}-py3.12-${{ hashFiles('apps/project-car/api/pyproject.toml') }}

      - name: Install shop-api (dev extras)
        if: steps.shop_changes.outputs.shop == 'true'
        run: |
          if [ -x .venv/bin/pytest ]; then
            .venv/bin/python -c "import fastapi, pytest" || rm -rf .venv
          fi
          if [ ! -x .venv/bin/pytest ]; then
            python -m venv .venv
            .venv/bin/python -m pip install -e ".[dev]"
          fi
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: pytest
        if: steps.shop_changes.outputs.shop == 'true'
        run: pytest

  shop-web:
    name: shop-web lint / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/project-car/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Shop OS changes
        id: shop_changes
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SHOP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          cd "$(git rev-parse --show-toplevel)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "shop=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${SHOP_BASE_SHA}"
          case "${base}" in
            *[!0-9a-fA-F]*|"")
              echo "pull request base sha is not hex" >&2
              exit 1
              ;;
          esac
          if [ "${#base}" -ne 40 ]; then
            echo "pull request base sha is not 40 hex characters" >&2
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${base}"
          fi
          changed="$(git diff --name-only --no-renames "${base}" HEAD)"
          shop=false
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            case "${path}" in
              *.md|*.txt|*.png|*.jpg|*.jpeg|*.svg|*.webp|*.SVG) continue ;;
              .github/workflows/shop-os-ci.yml|apps/project-car/web/*) shop=true; break ;;
              apps/project-car/api/*) continue ;;
              apps/project-car/*) shop=true; break ;;
            esac
          done <<< "${changed}"
          echo "shop=${shop}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node 22
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/project-car/web/package-lock.json

      - name: Cache shop-web modules
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/cache@v4
        with:
          path: apps/project-car/web/node_modules
          key: shop-web-modules-${{ runner.os }}-${{ hashFiles('apps/project-car/web/package-lock.json', 'apps/project-car/web/package.json') }}

      - name: Install shop-web
        if: steps.shop_changes.outputs.shop == 'true'
        run: |
          if [ ! -e node_modules/next/package.json ]; then
            npm ci
          fi

      - name: Lint / typecheck
        if: steps.shop_changes.outputs.shop == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.shop_changes.outputs.shop == 'true'
        run: npm test

      - name: next build smoke
        if: steps.shop_changes.outputs.shop == 'true'
        run: npm run build
        env:
          SHOP_API_URL: http://127.0.0.1:8000

  shop-web-visual:
    name: shop-web layout-shift / screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/project-car/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Shop OS changes
        id: shop_changes
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SHOP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          cd "$(git rev-parse --show-toplevel)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "shop=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${SHOP_BASE_SHA}"
          case "${base}" in
            *[!0-9a-fA-F]*|"")
              echo "pull request base sha is not hex" >&2
              exit 1
              ;;
          esac
          if [ "${#base}" -ne 40 ]; then
            echo "pull request base sha is not 40 hex characters" >&2
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${base}"
          fi
          changed="$(git diff --name-only --no-renames "${base}" HEAD)"
          shop=false
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            case "${path}" in
              # Screenshot PNGs and the baked clock run this job. Markdown and other images do not.
              apps/project-car/web/visual/*.png|apps/project-car/web/visual/shop-now.txt) shop=true; break ;;
              *.md|*.txt|*.png|*.jpg|*.jpeg|*.svg|*.webp|*.SVG) continue ;;
              apps/project-car/web/visual/*) shop=true; break ;;
              .github/workflows/shop-os-ci.yml|apps/project-car/*) shop=true; break ;;
            esac
          done <<< "${changed}"
          echo "shop=${shop}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python 3.12
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/project-car/api/pyproject.toml

      - name: Set up Node 22
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/project-car/web/package-lock.json

      - name: Cache shop-api environment
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/cache@v4
        with:
          path: apps/project-car/api/.venv
          key: shop-api-venv-${{ runner.os }}-py3.12-${{ hashFiles('apps/project-car/api/pyproject.toml') }}

      - name: Cache shop-web modules
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/cache@v4
        with:
          path: apps/project-car/web/node_modules
          key: shop-web-modules-${{ runner.os }}-${{ hashFiles('apps/project-car/web/package-lock.json', 'apps/project-car/web/package.json') }}

      - name: Install shop-api (dev extras)
        if: steps.shop_changes.outputs.shop == 'true'
        working-directory: apps/project-car/api
        run: |
          if [ -x .venv/bin/pytest ]; then
            .venv/bin/python -c "import fastapi, pytest" || rm -rf .venv
          fi
          if [ ! -x .venv/bin/pytest ]; then
            python -m venv .venv
            .venv/bin/python -m pip install -e ".[dev]"
          fi
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install shop-web
        if: steps.shop_changes.outputs.shop == 'true'
        run: |
          if [ ! -e node_modules/next/package.json ]; then
            npm ci
          fi

      - name: Read Playwright version
        if: steps.shop_changes.outputs.shop == 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.shop_changes.outputs.shop == 'true'
        id: pw_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.shop_changes.outputs.shop == 'true'
        run: |
          if [ "${{ steps.pw_cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Build shop-web at the frozen clock
        if: steps.shop_changes.outputs.shop == 'true'
        run: bash visual/build-web.sh

      - name: Restore screenshot baselines
        id: screenshot_baselines
        if: steps.shop_changes.outputs.shop == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/project-car/web/visual/screenshot-baselines
          key: shop-web-screenshot-baselines-${{ github.sha }}
          restore-keys: |
            shop-web-screenshot-baselines-

      - name: Apply screenshot baselines
        if: steps.shop_changes.outputs.shop == 'true'
        env:
          SHOP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash visual/apply-baselines.sh

      - name: Layout shift and screenshots
        if: steps.shop_changes.outputs.shop == 'true'
        run: npm run visual

      - name: Prepare screenshot baselines
        if: steps.shop_changes.outputs.shop == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf visual/screenshot-baselines
          mkdir -p visual/screenshot-baselines
          cp -a visual/screenshots/. visual/screenshot-baselines/

      - name: Store screenshot baselines
        if: steps.shop_changes.outputs.shop == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.screenshot_baselines.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/project-car/web/visual/screenshot-baselines
          key: shop-web-screenshot-baselines-${{ github.sha }}
