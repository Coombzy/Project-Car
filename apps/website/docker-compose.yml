# Project Car — public brochure site (Pages-ready static; local nginx optional)
services:
  website:
    image: nginx:1.27-alpine
    container_name: project-car-website
    ports:
      - "8088:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default: {}
      edge:
        ipv4_address: 172.30.0.10
        aliases:
          - project-car-website
          - website.projectcar.internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  edge:
    name: mission-control-edge
    external: true
